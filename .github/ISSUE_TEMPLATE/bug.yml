name: Bug report
description: Report a problem in the specification or the reference server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, use [private vulnerability reporting](https://github.com/OpenSharing-IO/OpenSharing/security/advisories/new) instead of a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Specification
        - Reference server
        - Documentation / website
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps, logs, or a spec section.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit, or specification version if known.
