# OpenSSF Best Practices: static_analysis / Scorecard: SAST.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "18 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for server module
        id: server
        run: |
          if [ -f server/pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Java 21
        if: steps.server.outputs.present == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/**/pom.xml

      - name: Initialize CodeQL
        if: steps.server.outputs.present == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        if: steps.server.outputs.present == 'true'
        run: mvn -B -ntp -f server/pom.xml -DskipTests compile

      - name: Perform CodeQL analysis
        if: steps.server.outputs.present == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:java-kotlin"

      - name: Skip
        if: steps.server.outputs.present != 'true'
        run: echo "No server/pom.xml in this revision; skipping CodeQL."
