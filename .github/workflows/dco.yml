# Enforce Developer Certificate of Origin sign-off on every commit in a PR.
# Required by the Technical Charter §7.b.ii.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list "$BASE"..HEAD); do
            if ! git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer."
              git log -1 --oneline "$commit"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with: git commit -s"
            echo "See CONTRIBUTING.md (Developer Certificate of Origin)."
            exit 1
          fi
