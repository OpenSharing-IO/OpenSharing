# OpenSSF Scorecard — automated supply-chain security checks.
# Docs: https://github.com/ossf/scorecard-action
# Results appear in the repo's Security > Code scanning tab and power the
# Scorecard badge in the README.
name: Scorecard supply-chain security

on:
  # Re-run when a branch protection rule changes (Scorecard checks these).
  branch_protection_rule:
  # Weekly full scan.
  schedule:
    - cron: "20 7 * * 1"
  # Run on pushes to the default branch.
  push:
    branches: ["main"]

# Least-privilege by default; the job below widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # OIDC token used to publish results (enables the public badge).
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results is required for the public Scorecard badge and
          # works on public repositories.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
