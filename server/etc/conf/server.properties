## OpenSharing standalone server settings, read from the directory the server is started in.
## A JVM system property (-Dserver.port=9090) or an environment variable with the same name as a
## key overrides it. A key left blank keeps its default.

# HTTP port the server listens on; 0 picks a free one.
server.port=8080

# Which CatalogConnector the server uses; local reads assets from a YAML file.
catalog.type=local
# The YAML file the local catalog reads: a classpath: resource or a file path.
catalog.local.file=classpath:local-catalog.yml
