# Defaults for a local run. Override any key without editing this file, either as an argument:
#   java -jar opensharing-server.jar --opensharing.delta.url-ttl=15m
# or as an environment variable:
#   OPENSHARING_DELTA_URLTTL=15m java -jar opensharing-server.jar
# Log levels are set in logback.xml.
server:
  # HTTP port the server listens on; 0 picks a free one.
  port: 8080

opensharing:
  # Prefix the protocol-serving endpoints are mounted under; this is what goes in a profile file.
  protocol-prefix: /api/1.0/opensharing
  asset-credentials:
    # Lifetime of the cloud credentials the catalog vends for reading an asset's storage.
    ttl: 1h
  pagination:
    # Page size for list endpoints when the client sends no maxResults.
    default-max-results: 500
    # Largest page size a client may request; larger values are capped to this.
    max-max-results: 1000
  storage:
    # Service-account key used to sign GCS URLs.
    gcs-service-account-key-file: ""
  delta:
    # Whether Query Table may return pre-signed file URLs to recipients.
    url-access-enabled: true
    # Lifetime of each pre-signed file URL.
    url-ttl: 1h
  catalog:
    # Which CatalogConnector the standalone server uses; local reads assets from a YAML file.
    type: local
    local:
      # The YAML file the local catalog reads: a classpath: resource or a file path.
      file: classpath:local-catalog.yml
