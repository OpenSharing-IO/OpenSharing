## OpenSharing standalone server database settings, read by Hibernate from the classpath.
## A JVM system property with the same name as a key overrides it.

# The in-memory database lives while the server's pool holds connections to it, so every server
# starts empty and loses its data on shutdown. The driver is derived from the URL, so pointing this
# at a file, Postgres or MySQL is the only change needed to keep the data.
hibernate.connection.url=jdbc:h2:mem:opensharing
hibernate.connection.username=sa
hibernate.connection.password=
# Hibernate's built-in pool is not for production. Flyway migrates the schema through this pool, so
# the provider must expose a DataSource.
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
# Flyway creates and upgrades the tables on startup; Hibernate must not change the schema itself.
# A persistent database whose tables 0.1.0 created without Flyway is not migrated and has to be
# recreated. FLYWAY_* environment variables configure Flyway further, except the connection and
# locations, which come from this file and the dialect.
hibernate.hbm2ddl.auto=none
# MySQL's datetime(6) stores no zone, so instants such as token expiry are written and read in UTC,
# whatever the server's own zone.
hibernate.jdbc.time_zone=UTC
