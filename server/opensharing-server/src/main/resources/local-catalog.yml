# Sample catalog for the file-backed connector (opensharing.catalog.type=local).
#
# Each entry is an asset the sharing server is allowed to resolve. Identifiers use the catalog's own
# namespace; a provider admin references them when adding an object to a share. Add sharableBy to an
# asset to restrict which principals may share it; leave it out and anyone may. The list is checked
# again on every read, of the owner of the share it comes through, so taking a name off it revokes.
#
# A SCHEMA entry can be shared as a whole, which shares every table whose identifier is the schema's
# plus one more level — including ones added to this file later.
credentials:
  provider: AWS
  # FAKE generates placeholder values so the server can be exercised without a cloud account.
  # Use STATIC with credentials.values to hand out real (long-lived) credentials instead.
  mode: FAKE
  ttlSeconds: 3600

assets:
  - identifier: main.sales.orders
    subtype: MANAGED
    storageLocation: s3://acme-lake/sales/orders/
    format: delta

  # An Iceberg table is loaded from the Iceberg REST catalog, which needs the pointer to its current
  # metadata document; without one the table can only be read in dir access mode.
  - identifier: main.sales.forecast
    subtype: MATERIALIZED_VIEW
    storageLocation: s3://acme-lake/sales/forecast/
    metadataLocation: s3://acme-lake/sales/forecast/metadata/00003-forecast.metadata.json
    format: iceberg

  - identifier: main.research.trial_results
    storageLocation: s3://acme-lake/research/trial-results/
    format: parquet

  # Sharing this shares both tables below it, and needs no storage location of its own.
  - identifier: main.hr
    type: SCHEMA

  - identifier: main.hr.employees
    storageLocation: s3://acme-lake/hr/employees/
    format: delta

  - identifier: main.hr.salaries
    storageLocation: s3://acme-lake/hr/salaries/
    format: delta
