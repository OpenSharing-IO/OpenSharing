# Sample catalog for catalog.type=local.
# FAKE credentials are placeholders. Use STATIC with credentials.values for real keys.
credentials:
  provider: AWS
  mode: FAKE
  ttlSeconds: 3600

# A principal holds only the privileges it lists.
principals:
  - bearerToken: alice-token
    userId: catalog-alice-id
    userName: alice
    privileges: [CREATE_SHARE, CREATE_RECIPIENT, USE_SHARE, USE_RECIPIENT]
  - bearerToken: bob-token
    userId: catalog-bob-id
    userName: bob
    privileges: [CREATE_SHARE, CREATE_RECIPIENT, USE_SHARE, USE_RECIPIENT]
  - bearerToken: carol-token
    userId: catalog-carol-id
    userName: carol
    privileges: [CREATE_SHARE, CREATE_RECIPIENT]

assets:
  - identifier: main.sales
    type: SCHEMA

  - identifier: main.sales.table1
    attributes:
      subtype: MANAGED
    storageLocation: s3://delta-exchange-test/delta-exchange-test/table1/
    format: delta

  - identifier: main.finance
    type: SCHEMA

  # Only the listed user ids may share this table.
  - identifier: main.finance.ledger
    storageLocation: s3://delta-exchange-test/delta-exchange-test/table1/
    format: delta
    shareableBy:
      - catalog-alice-id

  - identifier: main.sales.orders
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.sales.orders/
    format: delta

  - identifier: main.sales.customers
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.sales.customers/
    format: delta

  - identifier: main.hr
    type: SCHEMA

  - identifier: main.hr.employees
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.hr.employees/
    format: delta

  - identifier: main.hr.salaries
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.hr.salaries/
    format: delta

  - identifier: main.ops.people
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.ops.people/
    format: delta

  - identifier: main.legal
    type: SCHEMA

  - identifier: main.legal.Contracts
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://test/main.legal.Contracts/
    format: delta
