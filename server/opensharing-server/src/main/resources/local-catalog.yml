# Sample catalog for opensharing.catalog.type=local.
# FAKE credentials are placeholders. Use STATIC with credentials.values for real keys.
credentials:
  provider: AWS
  mode: FAKE
  ttlSeconds: 3600

principals:
  - bearerToken: alice-token
    userId: catalog-alice-id
    userName: alice
  - bearerToken: bob-token
    userId: catalog-bob-id
    userName: bob

assets:
  - identifier: main.sales
    type: SCHEMA

  - identifier: main.sales.table1
    subtype: MANAGED
    storageLocation: s3://delta-exchange-test/delta-exchange-test/table1/
    format: delta

  - identifier: main.sales.orders
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/main.sales.orders/
    format: delta

  - identifier: main.sales.customers
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/main.sales.customers/
    format: delta

  - identifier: main.hr
    type: SCHEMA

  - identifier: main.hr.employees
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/main.hr.employees/
    format: delta

  - identifier: main.hr.salaries
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/main.hr.salaries/
    format: delta

  - identifier: main.ops.people
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/main.ops.people/
    format: delta
