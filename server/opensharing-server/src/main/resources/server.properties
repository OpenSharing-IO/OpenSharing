## OpenSharing standalone server settings, read from the classpath.
## A JVM system property (-Dserver.port=9090) or an environment variable with the same name as a
## key overrides it. A key left blank keeps its default.

# HTTP port the server listens on; 0 picks a free one.
server.port=8080
# Address recipients reach this server at, such as https://sharing.example.com. Required:
# activation links and the endpoint in profile files are built on it.
server.public-url=

# Path prefix of the provider API, whose bearer tokens the catalog authenticates.
provider.base-path=/api/1.0/opensharing/provider
# Path prefix recipient activation links are built under, after server.public-url.
activation.base-path=/api/1.0/opensharing/activations

# Which CatalogConnector the server uses; local reads assets from a YAML file.
catalog.type=local
# The YAML file the local catalog reads: a classpath: resource or a file path.
catalog.local.file=classpath:local-catalog.yml
