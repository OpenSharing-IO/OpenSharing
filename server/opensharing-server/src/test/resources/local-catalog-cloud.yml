# Local catalog used by cloud-backed protocol integration tests.
# ENV mode chooses AWS, Azure, or GCP credentials from each asset's URI scheme.
credentials:
  mode: ENV
  ttlSeconds: 900

principals:
  - bearerToken: alice-token
    userId: catalog-alice-id
    userName: alice
    privileges: [CREATE_SHARE, CREATE_RECIPIENT, USE_SHARE, USE_RECIPIENT]

assets:
  - identifier: main.sales
    type: SCHEMA

  - identifier: main.sales.table1
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://delta-exchange-test/delta-exchange-test/table1/
    format: delta

  - identifier: main.sales.startingtimestamp
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://delta-exchange-test/delta-exchange-test/table_startingtimestamp_test/
    format: delta

  - identifier: main.sales.deletionvectors
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: s3://delta-exchange-test/delta-exchange-test/deletion_vectors_with_dvs_dv_property_on
    format: delta

  - identifier: main.sales.azure
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: abfss://delta-sharing-test-container@deltasharingtest.dfs.core.windows.net/delta-sharing-test/table1
    format: delta

  - identifier: main.sales.gcs
    type: TABLE
    attributes:
      subtype: MANAGED
    storageLocation: gs://delta-sharing-dev/delta-sharing-test/table1
    format: delta
