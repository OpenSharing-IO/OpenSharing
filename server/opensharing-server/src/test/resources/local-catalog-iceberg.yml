# Iceberg endpoint test catalog; tests replace ${tables} and ${aliceToken}.
principals:
  - bearerToken: ${aliceToken}
    userId: catalog-alice-id
    userName: alice
    privileges: [CREATE_SHARE, CREATE_RECIPIENT, USE_SHARE, USE_RECIPIENT]
assets:
  - identifier: main.sales
    type: SCHEMA
  - identifier: main.sales.orders
    storageLocation: ${tables}orders/
    format: delta
  - identifier: main.sales.customers
    storageLocation: ${tables}customers/
    format: delta
  - identifier: main.hr
    type: SCHEMA
  - identifier: main.hr.employees
    storageLocation: ${tables}employees/
    format: delta
  - identifier: main.lake
    type: SCHEMA
  - identifier: main.lake.trips
    storageLocation: ${tables}trips/
    format: iceberg
    metadataLocation: ${tables}trips/metadata/00001-9c12d441-03fe-4693-9a96-a0705ddf69c1.metadata.json
  - identifier: main.lake.stations
    storageLocation: ${tables}stations/
    format: iceberg
  - identifier: main.lake.astray
    storageLocation: ${tables}astray/
    format: iceberg
    metadataLocation: ${tables}elsewhere/metadata/00001.metadata.json
  - identifier: main.lake.unpointed
    storageLocation: ${tables}unpointed/
    format: iceberg
