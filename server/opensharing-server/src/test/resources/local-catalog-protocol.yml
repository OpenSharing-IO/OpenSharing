# Local catalog for recipient protocol API tests (FAKE credentials, no cloud access).
credentials:
  provider: AWS
  mode: FAKE
  ttlSeconds: 3600

principals:
  - bearerToken: alice-token
    userId: catalog-alice-id
    userName: alice

assets:
  - identifier: catalog.sales
    type: SCHEMA
  - identifier: catalog.sales.orders
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.sales.orders/
    format: delta
  - identifier: catalog.sales.customers
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.sales.customers/
    format: delta
  - identifier: catalog.sales.a
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.sales.a/
    format: delta
  - identifier: catalog.sales.b
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.sales.b/
    format: delta

  - identifier: catalog.hr
    type: SCHEMA
  - identifier: catalog.hr.employees
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.hr.employees/
    format: delta
  - identifier: catalog.hr.salaries
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.hr.salaries/
    format: delta

  - identifier: catalog.ops.people
    type: TABLE
    subtype: MANAGED
    storageLocation: s3://test/catalog.ops.people/
    format: delta

  - identifier: catalog.alpha.t1
    type: TABLE
